name: sharding-repl-cache

# Общие настройки узла шарда
x-shard-node: &shard-node
  image: dh-mirror.gitverse.ru/mongo:latest
  restart: always
  healthcheck:
    test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "db.adminCommand('ping').ok"]
    interval: 5s
    timeout: 5s
    retries: 10
    start_period: 10s

services:
  # Сервер конфигурации (replica set из одного узла)
  configSrv:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: configSrv
    restart: always
    command: ["--configsvr", "--replSet", "config_server", "--bind_ip_all", "--port", "27019"]
    volumes:
      - config-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Шард 1: replica set shard1 (PRIMARY + 2 реплики)
  shard1:
    <<: *shard-node
    container_name: shard1
    command: ["--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27018"]
    volumes:
      - shard1-data:/data/db

  shard1-replica1:
    <<: *shard-node
    container_name: shard1-replica1
    command: ["--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27018"]
    volumes:
      - shard1-replica1-data:/data/db

  shard1-replica2:
    <<: *shard-node
    container_name: shard1-replica2
    command: ["--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27018"]
    volumes:
      - shard1-replica2-data:/data/db

  # Шард 2: replica set shard2 (PRIMARY + 2 реплики)
  shard2:
    <<: *shard-node
    container_name: shard2
    command: ["--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27018"]
    volumes:
      - shard2-data:/data/db

  shard2-replica1:
    <<: *shard-node
    container_name: shard2-replica1
    command: ["--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27018"]
    volumes:
      - shard2-replica1-data:/data/db

  shard2-replica2:
    <<: *shard-node
    container_name: shard2-replica2
    command: ["--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27018"]
    volumes:
      - shard2-replica2-data:/data/db

  # Роутер (mongos)
  mongos_router:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: mongos_router
    restart: always
    command: ["mongos", "--configdb", "config_server/configSrv:27019", "--bind_ip_all", "--port", "27017"]
    depends_on:
      configSrv:
        condition: service_healthy
      shard1:
        condition: service_healthy
      shard1-replica1:
        condition: service_healthy
      shard1-replica2:
        condition: service_healthy
      shard2:
        condition: service_healthy
      shard2-replica1:
        condition: service_healthy
      shard2-replica2:
        condition: service_healthy
    ports:
      - 27017:27017
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Кеш для приложения
  redis:
    image: dh-mirror.gitverse.ru/redis:latest
    container_name: redis
    restart: always
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  pymongo_api:
    container_name: pymongo_api
    build:
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      mongos_router:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - 8080:8080
    environment:
      MONGODB_URL: "mongodb://mongos_router:27017"
      MONGODB_DATABASE_NAME: "somedb"
      REDIS_URL: "redis://redis:6379"

volumes:
  config-data:
  shard1-data:
  shard1-replica1-data:
  shard1-replica2-data:
  shard2-data:
  shard2-replica1-data:
  shard2-replica2-data:
  redis-data:
